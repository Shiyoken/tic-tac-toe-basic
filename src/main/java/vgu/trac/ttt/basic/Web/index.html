<!DOCTYPE html>
<html>
<head>
    <title>Tic-Tac-Toe</title>
    <style>
        body { 
            text-align: center; 
            font-family: Arial; 
        }

        h1 { 
            margin-top: 40px; 
        }

        table { 
            margin: 30px auto; 
            border-collapse: collapse; 
        }
        td {
            width: 100px;
            height: 100px;
            border: 3px solid black;
            font-size: 50px;
            text-align: center;
            cursor: pointer;
        }
        td:hover { 
            background-color: #d0eaff; 
        }

        #status { font-size: 24px; margin: 10px; }
        #startBtn { font-size: 20px; padding: 10px 30px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <p id="status">Press Start to begin!</p>
    <button id="startBtn">Start NEW Game</button>

    <table>
        <tr>
            <td id="cell-1"></td>
            <td id="cell-2"></td>
            <td id="cell-3"></td>
        </tr>
        <tr>
            <td id="cell-4"></td>
            <td id="cell-5"></td>
            <td id="cell-6"></td>
        </tr>
        <tr>
            <td id="cell-7"></td>
            <td id="cell-8"></td>
            <td id="cell-9"></td>
        </tr>
    </table>

    <script>
        const SERVER_URL = "http://localhost:1234";
        let currentBoard = "000000000";
        let gameActive = false;

        document.getElementById("startBtn").addEventListener("click", startGame); // What is click??? name
        function drawBoard(boardString) {
            for (let i = 1; i <= 9; i++) {
                const cell = document.getElementById("cell-" + i);
                const value = boardString[i - 1];

                if (value == "1") {
                    cell.textContent = "1";
                }
                else if (value == "2") {
                    cell.textContent = "2";
                }
                else {
                    cell.textContent = "0";
                }
            }
        }
        async function startGame() {
            gameActive = true;
            // What does fetch do? Send a method to this URL http://localhost:1234/start
            const response = await fetch(SERVER_URL + "/start");
            // Read the JSON: {"board":"000000000"; "status: PLAYING"}
            const data = await response.json(); 
            // Update the board
            currentBoard = data.board;
            drawBoard(currentBoard);
            document.getElementById("status").textContent = data.status;
        }
        async function makeMove(cellNumber) {
            if (!gameActive) {
                return;
            }
            const payload = JSON.stringify({
                board: currentBoard,
                move: String(cellNumber)
            });
            const response = await fetch(SERVER_URL + "/play", {
                method: "POST",
                headers: {"Content-Type" : "application/json"},
                body: payload
            });
            const data = await response.json();
            // document.getElementById("status").textContent = data.status;
            
            // if (data.status == "ERROR_FORMAT" || data.status == "ERROR_INVALID" || data.status == "ERROR_EMPTY") {
            //     return;
            // } 
            if (data.status == "ERROR_EMPTY") {
                document.getElementById("status").textContent = "The cell is already occupied";
                return;
            }
            if (data.status == "HUMAN_WIN" || data.status == "COMPUTER_WIN" || data.status == "DRAW") {
                gameActive = false;
            }
            document.getElementById("status").textContent = data.status;
            currentBoard = data.board;
            drawBoard(currentBoard);
        }
        for (let i = 1; i <= 9; i++) {
            document.getElementById("cell-" + i).addEventListener("click", function() {
                makeMove(i);
            });
        }
    </script>

</body>
</html>
